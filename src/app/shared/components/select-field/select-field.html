<div class="select-field">
  <button class="select-trigger" type="button" (click)="toggle()">
    @if (selectedOption(); as option) {
      @if (option.colorHex) {
        <span class="dot" [style.background]="option.colorHex"></span>
      }
      <span class="select-value">{{ option.label }}</span>
    } @else {
      <span class="select-value placeholder">{{ placeholder() }}</span>
    }
    <svg class="chevron" viewBox="0 0 16 16" aria-hidden="true">
      <path
        d="M4 6l4 4 4-4"
        stroke="currentColor"
        stroke-width="1.6"
        fill="none"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </button>

  @if (open()) {
    <div class="picker-backdrop" (click)="close()"></div>
    <div class="select-panel">
      @for (option of options(); track option.value) {
        <button
          class="select-option"
          type="button"
          [class.selected]="option.value === value()"
          (click)="choose(option)"
        >
          @if (option.colorHex) {
            <span class="dot" [style.background]="option.colorHex"></span>
          }
          {{ option.label }}
        </button>
      }
    </div>
  }
</div>
