<section class="page">
  <h1>Categorías</h1>

  <div class="badge-row">
    @for (category of categories(); track category.id) {
      <app-category-badge [category]="category" />
    }
  </div>

  <form class="create-form" [formGroup]="form" (ngSubmit)="submit()">
    <label class="field">
      <input formControlName="name" placeholder="Nombre de la categoría" />
    </label>

    <app-color-picker-field
      [value]="form.controls.color_hex.value"
      (valueChange)="setColor($event)"
    />

    <button class="btn btn-primary" type="submit" [disabled]="form.invalid">Crear categoría</button>
  </form>

  @if (errorMessage()) {
    <p class="error">{{ errorMessage() }}</p>
  }
</section>
