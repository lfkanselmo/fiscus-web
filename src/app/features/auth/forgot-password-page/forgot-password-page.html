<section class="page auth-page">
  <h1>Recuperar contraseña</h1>

  @if (!submitted()) {
    <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
      <label class="field">
        <input type="email" formControlName="email" placeholder="Correo electrónico" />
      </label>
      <button class="btn btn-primary" type="submit" [disabled]="form.invalid">
        Enviar instrucciones
      </button>
    </form>

    @if (errorMessage()) {
      <p class="error">{{ errorMessage() }}</p>
    }
  } @else {
    <p>Si el correo existe, se enviaron instrucciones para restablecer tu contraseña.</p>
  }

  <p class="auth-switch"><a routerLink="/login">Volver a iniciar sesión</a></p>
</section>
