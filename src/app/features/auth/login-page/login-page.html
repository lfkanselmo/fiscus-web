<section class="page auth-page">
  <h1>Iniciar sesión</h1>

  <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
    <label class="field">
      <input type="email" formControlName="email" placeholder="Correo electrónico" />
    </label>
    <label class="field">
      <input type="password" formControlName="password" placeholder="Contraseña" />
    </label>
    <button class="btn btn-primary" type="submit" [disabled]="form.invalid">Entrar</button>
  </form>

  @if (errorMessage()) {
    <p class="error">{{ errorMessage() }}</p>
  }

  <p class="auth-switch">¿No tienes cuenta? <a routerLink="/register">Regístrate</a></p>
</section>
