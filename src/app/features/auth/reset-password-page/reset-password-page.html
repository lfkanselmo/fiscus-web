<section class="page auth-page">
  <h1>Restablecer contraseña</h1>

  <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
    <label class="field">
      <input
        type="password"
        formControlName="password"
        placeholder="Nueva contraseña (mínimo 8 caracteres)"
      />
    </label>
    <label class="field">
      <input type="password" formControlName="confirmPassword" placeholder="Confirmar contraseña" />
    </label>
    @if (form.errors?.['passwordsMismatch'] && form.controls.confirmPassword.dirty) {
      <p class="error">Las contraseñas no coinciden.</p>
    }
    <button class="btn btn-primary" type="submit" [disabled]="form.invalid || !token">
      Restablecer contraseña
    </button>
  </form>

  @if (errorMessage()) {
    <p class="error">{{ errorMessage() }}</p>
  }

  <p class="auth-switch"><a routerLink="/login">Volver a iniciar sesión</a></p>
</section>
