<section class="page auth-page">
  <h1>Crear cuenta</h1>

  <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
    <label class="field">
      <input type="email" formControlName="email" placeholder="Correo electrónico" />
    </label>
    <label class="field">
      <input
        type="password"
        formControlName="password"
        placeholder="Contraseña (mínimo 8 caracteres)"
      />
    </label>
    <label class="field">
      <input type="password" formControlName="confirmPassword" placeholder="Confirmar contraseña" />
    </label>
    @if (form.errors?.['passwordsMismatch'] && form.controls.confirmPassword.dirty) {
      <p class="error">Las contraseñas no coinciden.</p>
    }
    <button class="btn btn-primary" type="submit" [disabled]="form.invalid">Crear cuenta</button>
  </form>

  @if (errorMessage()) {
    <p class="error">{{ errorMessage() }}</p>
  }

  <p class="auth-switch">¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
</section>
