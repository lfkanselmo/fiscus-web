<header class="app-header">
  <div class="lockup">
    <svg viewBox="0 0 100 100" role="img" aria-label="Isotipo Fiscus">
      <rect x="30" y="18" width="13" height="64" rx="3" fill="var(--ink)" />
      <rect x="30" y="18" width="52" height="13" rx="3" fill="var(--ink)" />
      <rect x="30" y="45" width="36" height="10" rx="3" fill="var(--accent)" />
    </svg>
    <span>Fiscus</span>
  </div>

  <nav>
    @if (authService.isAuthenticated()) {
      <a routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
      <a routerLink="/transacciones" routerLinkActive="active">Transacciones</a>
      <a routerLink="/categorias" routerLinkActive="active">Categorías</a>
      <a routerLink="/importar" routerLinkActive="active">Importar</a>
    }
    <app-theme-toggle />
    @if (authService.isAuthenticated()) {
      <button class="btn btn-ghost" type="button" (click)="authService.logout()">
        Cerrar sesión
      </button>
    }
  </nav>
</header>

<main>
  <router-outlet />
</main>
